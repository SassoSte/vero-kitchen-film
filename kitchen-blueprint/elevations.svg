<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 228" font-family="Helvetica, Arial, sans-serif">
  <!-- UNIT 2130 KITCHEN ELEVATIONS — 1 unit = 1 inch — derived 2026-10-07, not for construction -->
  <rect width="460" height="228" fill="#ffffff"/>
  <rect x="8" y="8" width="444" height="212" fill="none" stroke="#1a1a1a" stroke-width="1.25"/>
  <rect x="9.5" y="9.5" width="441" height="209" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>

  <!-- ===== ELEVATION A — local y = 96 − height AFF ===== -->
  <g transform="translate(46,36)" stroke="#1a1a1a" fill="none">
    <line x1="0" y1="0" x2="123" y2="0" stroke-width="1.15"/>
    <line x1="-3" y1="96" x2="126" y2="96" stroke-width="1.7"/>
    <line x1="0" y1="0" x2="0" y2="96" stroke-width="2.6"/>
    <line x1="123" y1="0" x2="123" y2="96" stroke-width="0.7" stroke-dasharray="2.4 1.7"/>

    <!-- Backsplash and counter on cabinet runs only -->
    <rect x="33" y="56" width="24" height="4" fill="#e4ddd2" stroke="none"/>
    <rect x="87" y="56" width="36" height="4" fill="#e4ddd2" stroke="none"/>
    <line x1="33" y1="60" x2="57" y2="60" stroke-width="1.5"/>
    <line x1="87" y1="60" x2="123" y2="60" stroke-width="1.5"/>

    <!-- Short upper over the refrigerator, 66½–84 -->
    <rect x="1.5" y="12" width="30" height="17.5" fill="#f3f0ea" stroke-width="0.75"/>
    <!-- Refrigerator, 66½ tall -->
    <rect x="1.5" y="29.5" width="30" height="66.5" fill="#ffffff" stroke-width="0.9"/>
    <line x1="1.5" y1="50" x2="31.5" y2="50" stroke-width="0.55"/>

    <!-- Upper and base, 24″ -->
    <rect x="33" y="12" width="24" height="30" fill="#f3f0ea" stroke-width="0.75"/>
    <rect x="33" y="60" width="24" height="36" fill="#f3f0ea" stroke-width="0.75"/>

    <!-- Range: backguard to 47″, body to the floor, cooktop at counter height -->
    <rect x="57" y="49" width="30" height="47" fill="#ffffff" stroke-width="0.9"/>
    <line x1="57" y1="60" x2="87" y2="60" stroke-width="1.15"/>
    <rect x="63" y="72" width="18" height="12" stroke-width="0.55"/>

    <!-- Over-the-range microwave, bottom rail 67″ -->
    <rect x="57" y="13" width="30" height="16" fill="#ffffff" stroke-width="0.9"/>

    <!-- Upper and base, 36″ -->
    <rect x="87" y="12" width="36" height="30" fill="#f3f0ea" stroke-width="0.75"/>
    <rect x="87" y="60" width="36" height="36" fill="#f3f0ea" stroke-width="0.75"/>

    <g fill="#1a1a1a" stroke="none" font-size="3.6" text-anchor="middle">
      <text x="16.5" y="58">FRIDGE</text>
      <text x="16.5" y="63">30″</text>
      <text x="45" y="28">UPPER</text>
      <text x="45" y="80">24″</text>
      <text x="72" y="22">OTR</text>
      <text x="72" y="80">RANGE</text>
      <text x="105" y="28">UPPERS</text>
      <text x="105" y="80">36″</text>
    </g>

    <!-- Width -->
    <g stroke="#6b6560" fill="#6b6560" stroke-width="0.5" font-size="3.8">
      <line x1="0" y1="-10" x2="123" y2="-10"/>
      <line x1="0" y1="-13" x2="0" y2="-7"/>
      <line x1="123" y1="-13" x2="123" y2="-7"/>
      <text x="61.5" y="-16" text-anchor="middle" stroke="none">123″  ·  10′–3″</text>
    </g>

    <!-- Height -->
    <g stroke="#6b6560" fill="#6b6560" stroke-width="0.5" font-size="3.6">
      <line x1="-14" y1="0" x2="0" y2="0"/>
      <line x1="-14" y1="96" x2="0" y2="96"/>
      <line x1="-14" y1="0" x2="-14" y2="96"/>
      <line x1="-17" y1="0" x2="-11" y2="0"/>
      <line x1="-17" y1="96" x2="-11" y2="96"/>
      <text x="-20" y="48" text-anchor="middle" stroke="none" transform="rotate(-90 -20 48)">96″ ceiling</text>
    </g>
  </g>

  <text x="107.5" y="152" fill="#1a1a1a" font-size="5.2" text-anchor="middle">NORTH RUN</text>
  <text x="107.5" y="160" fill="#3f3a34" font-size="3.8" text-anchor="middle">Hall side</text>

  <!-- ===== ELEVATION B ===== -->
  <g transform="translate(250,36)" stroke="#1a1a1a" fill="none">
    <line x1="0" y1="0" x2="123" y2="0" stroke-width="1.15"/>
    <line x1="-3" y1="96" x2="126" y2="96" stroke-width="1.7"/>
    <line x1="0" y1="0" x2="0" y2="96" stroke-width="2.6"/>
    <line x1="123" y1="0" x2="123" y2="96" stroke-width="0.7" stroke-dasharray="2.4 1.7"/>

    <!-- Knee wall under the bar -->
    <rect x="0" y="60" width="66" height="36" fill="#f3f0ea" stroke-width="0.8"/>
    <!-- Sink base -->
    <rect x="66" y="60" width="33" height="36" fill="#f3f0ea" stroke-width="0.75"/>
    <!-- Dishwasher, 34″ high -->
    <rect x="99" y="60" width="24" height="36" fill="#ffffff" stroke-width="0.9"/>
    <line x1="103" y1="66" x2="119" y2="66" stroke-width="0.7"/>

    <line x1="0" y1="60" x2="123" y2="60" stroke-width="1.5"/>
    <!-- Raised cap, top at 43″ AFF -->
    <rect x="54" y="53" width="60" height="2.2" fill="#d9d2c6" stroke-width="0.6"/>

    <!-- Track -->
    <line x1="22" y1="5" x2="104" y2="5" stroke-width="1.15"/>
    <line x1="32" y1="5" x2="29" y2="10" stroke-width="0.6"/>
    <line x1="52" y1="5" x2="49" y2="10" stroke-width="0.6"/>
    <line x1="74" y1="5" x2="71" y2="10" stroke-width="0.6"/>
    <line x1="94" y1="5" x2="91" y2="10" stroke-width="0.6"/>

    <g fill="#1a1a1a" stroke="none" font-size="3.6" text-anchor="middle">
      <text x="27" y="28">BAR</text>
      <text x="27" y="33.5">66″</text>
      <text x="84" y="28">RAISED CAP</text>
      <text x="84" y="33" font-size="3.3">42–44″</text>
      <line x1="84" y1="36" x2="84" y2="52" stroke="#1a1a1a" stroke-width="0.45"/>
      <text x="82.5" y="80">SINK</text>
      <text x="111" y="80">DW</text>
    </g>

    <g stroke="#6b6560" fill="#6b6560" stroke-width="0.5" font-size="3.8">
      <line x1="0" y1="-10" x2="123" y2="-10"/>
      <line x1="0" y1="-13" x2="0" y2="-7"/>
      <line x1="123" y1="-13" x2="123" y2="-7"/>
      <text x="61.5" y="-16" text-anchor="middle" stroke="none">123″  ·  10′–3″</text>
    </g>

    <g stroke="#6b6560" fill="#6b6560" stroke-width="0.5" font-size="3.6">
      <line x1="-14" y1="60" x2="0" y2="60"/>
      <line x1="-14" y1="96" x2="0" y2="96"/>
      <line x1="-14" y1="60" x2="-14" y2="96"/>
      <line x1="-17" y1="60" x2="-11" y2="60"/>
      <line x1="-17" y1="96" x2="-11" y2="96"/>
      <text x="-22" y="78" text-anchor="middle" stroke="none" transform="rotate(-90 -22 78)">36″</text>
    </g>
  </g>

  <text x="311.5" y="152" fill="#1a1a1a" font-size="5.2" text-anchor="middle">SOUTH RUN</text>
  <text x="311.5" y="160" fill="#3f3a34" font-size="3.8" text-anchor="middle">Living side</text>

  <!-- Title strip -->
  <line x1="8" y1="172" x2="452" y2="172" stroke="#1a1a1a" stroke-width="0.7"/>
  <g fill="#1a1a1a">
    <text x="20" y="186" font-size="6.5">KITCHEN ELEVATIONS</text>
    <text x="20" y="196" font-size="4">Unit 2130  ·  The Allison Condominiums</text>
    <text x="20" y="204" font-size="3.7" fill="#3f3a34">14145 N 92nd St #2130, Scottsdale</text>

    <text x="250" y="186" font-size="3.6" fill="#6b6560" letter-spacing="0.6">HEIGHTS</text>
    <text x="250" y="196" font-size="3.7">Counter 36″  ·  Uppers 54–84″</text>
    <text x="250" y="204" font-size="3.7">Microwave rail 67″  ·  Cap 42–44″</text>

    <text x="432" y="196" font-size="3.7" text-anchor="end">1 unit  =  1 inch</text>
    <text x="432" y="206" font-size="3.7" text-anchor="end">NOT FOR CONSTRUCTION</text>
  </g>
</svg>
