="#735d3b" stroke-width=".5"/><text x="13" y="25" text-anchor="middle" font-size="3.5">ITALIA</text><text x="13" y="30" text-anchor="middle" font-size="2.5">18 x 24 incl. frame</text><rect x="4" y="42" width="18" height="18" fill="#e9e3d8" stroke="#444" stroke-width=".4"/><line x1="15.5" y1="42" x2="15.5" y2="60" stroke="#777" stroke-width=".3"/><text x="9.75" y="50" text-anchor="middle" font-size="2.6">COFFEE</text><text x="9.75" y="54" text-anchor="middle" font-size="2.6">GARAGE</text><text x="18.75" y="48" text-anchor="middle" font-size="2">SPICE</text><text x="18.75" y="55" text-anchor="middle" font-size="2">TECH</text><rect x="4" y="60" width="18" height="36" fill="#dde7df" stroke="#444" stroke-width=".4"/><rect x="5.5" y="62" width="15" height="29" fill="#294036" stroke="#ccc" stroke-width=".4"/><text x="13" y="75" text-anchor="middle" font-size="3" fill="white">15 WINE</text><text x="13" y="80" text-anchor="middle" font-size="2.5" fill="white">GLASS DOOR</text><text x="30" y="59" font-size="2.8">36 AFF counter</text><text x="30" y="43" font-size="2.8">54 AFF garage top</text><text x="30" y="17" font-size="2.8">81 AFF art top</text><text x="30" y="96" font-size="2.8">FLOOR</text></g><text x="55" y="730" font-size="17">Keep wine/coffee at sink end of end wall. Dishwasher counter stays clear.</text><text x="55" y="765" font-size="16">Nominal remaining main-door envelope margin: 3–4.5 in; room estimate uncertainty: ±2–3 in.</text><text x="55" y="800" font-size="16">Main fridge: right hinge / bottom drawer. Wine hinge and rack access require a full swing check.</text><text x="55" y="835" font-size="16">Coffee tray: full extension, approximately 14 in. Machine operates outside garage with front open.</text><text x="55" y="870" font-size="16">All spice/tech storage stays inside the same 18-inch upper module; no extra wall shelf in the swing zone.</text></g><g transform="translate(55 165) scale(5)" font-family="Arial"><rect x="0" y="79.5" width="24" height="25.5" fill="#bfbab0" stroke="#555" stroke-width=".3"/><rect x="24" y="79.5" width="3" height="25.5" fill="#fff" stroke="#777" stroke-width=".2"/><rect x="27" y="79.5" width="24" height="25.5" fill="#c5dce7" stroke="#386477" stroke-width=".4"/><g font-size="2.5" text-anchor="middle" fill="#26322e"><text x="12" y="90">BLIND</text><text x="12" y="95">RETURN</text><text x="39" y="90">MICROWAVE</text><text x="39" y="95">x27–51</text></g></g></svg>