<svg xmlns="http://www.w3.org/2000/svg" viewBox="-48 -56 456 236" font-family="Helvetica, Arial, sans-serif">
  <!-- UNIT 2130 KITCHEN PLAN — 1 unit = 1 inch — derived 2026-10-07, not for construction -->
  <rect x="-48" y="-56" width="456" height="236" fill="#ffffff"/>
  <rect x="-40" y="-48" width="440" height="220" fill="none" stroke="#1a1a1a" stroke-width="1.25"/>
  <rect x="-38.5" y="-46.5" width="437" height="217" fill="none" stroke="#1a1a1a" stroke-width="0.35"/>

  <!-- ===== PLAN ===== -->
  <g stroke="#1a1a1a" fill="none">
    <!-- Walls -->
    <line x1="0" y1="-8" x2="0" y2="111" stroke-width="3.25"/>
    <line x1="0" y1="-8" x2="129" y2="-8" stroke-width="3.25"/>
    <line x1="129" y1="-8" x2="129" y2="28" stroke-width="3.25"/>
    <line x1="129" y1="78" x2="129" y2="111" stroke-width="3.25"/>

    <!-- Run A counter -->
    <rect x="0" y="0" width="123" height="25.5" fill="#f3f0ea" stroke-width="1.15"/>
    <rect x="0" y="0" width="33" height="25.5" fill="#ffffff" stroke-width="0.8"/>
    <rect x="57" y="0" width="30" height="25.5" fill="#ffffff" stroke-width="0.8"/>
    <line x1="33" y1="0" x2="33" y2="25.5" stroke-width="0.7"/>
    <line x1="57" y1="0" x2="57" y2="25.5" stroke-width="0.7"/>
    <line x1="87" y1="0" x2="87" y2="25.5" stroke-width="0.7"/>

    <!-- Run B counter -->
    <rect x="0" y="79.5" width="123" height="25.5" fill="#f3f0ea" stroke-width="1.15"/>
    <rect x="99" y="79.5" width="24" height="25.5" fill="#ffffff" stroke-width="0.8"/>
    <line x1="66" y1="79.5" x2="66" y2="105" stroke-width="0.7"/>
    <line x1="99" y1="79.5" x2="99" y2="105" stroke-width="0.7"/>
    <!-- Dishwasher pull -->
    <line x1="103" y1="86" x2="119" y2="86" stroke-width="0.8"/>

    <!-- Raised cap along the living edge, stopping at the dishwasher -->
    <line x1="54" y1="102" x2="99" y2="102" stroke-dasharray="2.2 1.6" stroke-width="0.9"/>

    <!-- Bar overhang -->
    <line x1="0" y1="118" x2="66" y2="118" stroke-dasharray="2.2 1.6" stroke-width="0.8"/>

    <!-- Clerestory -->
    <rect x="38" y="-12" width="48" height="4" stroke-width="0.9"/>
    <line x1="40" y1="-12" x2="40" y2="-8" stroke-width="0.45"/>
    <line x1="84" y1="-12" x2="84" y2="-8" stroke-width="0.45"/>

    <!-- Track lights -->
    <line x1="20" y1="40" x2="108" y2="40" stroke-dasharray="5 2.5" stroke-width="0.7"/>
    <line x1="20" y1="66" x2="108" y2="66" stroke-dasharray="5 2.5" stroke-width="0.7"/>

    <!-- Stools -->
    <circle cx="14" cy="132" r="6.5" fill="#ffffff" stroke-width="0.9"/>
    <circle cx="36" cy="132" r="6.5" fill="#ffffff" stroke-width="0.9"/>
    <circle cx="58" cy="132" r="6.5" fill="#ffffff" stroke-width="0.9"/>
  </g>

  <!-- In-drawing labels -->
  <g fill="#1a1a1a" font-size="4.4" text-anchor="middle">
    <text x="16.5" y="11.5">FRIDGE</text>
    <text x="16.5" y="17.5">30″</text>
    <text x="45" y="14.5">BASE 24″</text>
    <text x="72" y="11.5">RANGE</text>
    <text x="72" y="17.5">30″</text>
    <text x="105" y="14.5">BASE 36″</text>

    <text x="33" y="93">BAR 66″</text>
    <text x="82.5" y="93">SINK 33″</text>
    <text x="111" y="93">DW 24″</text>

    <text x="61.5" y="54" font-size="5">AISLE 54″</text>
    <text x="36" y="146" font-size="4.2">THREE STOOLS</text>
  </g>

  <!-- Callouts, kept in the gutter -->
  <g fill="#3f3a34" font-size="3.7" stroke="#3f3a34">
    <line x1="108" y1="40" x2="138" y2="34" stroke-width="0.45"/>
    <text x="140" y="32" stroke="none">Two 4-head tracks</text>

    <polyline points="84,102 84,112 140,112" fill="none" stroke-width="0.45"/>
    <text x="144" y="114.5" stroke="none">Raised cap  42–44″ AFF</text>

    <line x1="66" y1="118" x2="140" y2="126" stroke-width="0.45"/>
    <text x="144" y="129" stroke="none">Overhang 12–13″</text>

    <line x1="129" y1="53" x2="140" y2="53" stroke-width="0.45"/>
    <polyline points="136,50.5 140,53 136,55.5" fill="none" stroke-width="0.45"/>
    <text x="144" y="51.5" stroke="none">To dining</text>
    <text x="144" y="56.5" stroke="none">and laundry</text>

    <text x="62" y="-18" fill="#3f3a34" stroke="none" text-anchor="middle">Clerestory 48 × 18″</text>
    <line x1="70" y1="136" x2="140" y2="142" stroke-width="0.45"/>
    <text x="144" y="145" stroke="none">Living room, vaulted</text>
  </g>

  <!-- Dimensions -->
  <g stroke="#6b6560" fill="#6b6560" stroke-width="0.55" font-size="4.2">
    <line x1="0" y1="-28" x2="123" y2="-28"/>
    <line x1="0" y1="-32" x2="0" y2="-24"/>
    <line x1="123" y1="-32" x2="123" y2="-24"/>
    <text x="61.5" y="-34" text-anchor="middle" stroke="none">123″  ·  10′–3″</text>

    <line x1="0" y1="154" x2="123" y2="154"/>
    <line x1="0" y1="150" x2="0" y2="158"/>
    <line x1="123" y1="150" x2="123" y2="158"/>
    <text x="61.5" y="166" text-anchor="middle" stroke="none">123″  ·  10′–3″</text>

    <line x1="-18" y1="0" x2="-18" y2="105"/>
    <line x1="-22" y1="0" x2="-14" y2="0"/>
    <line x1="-22" y1="105" x2="-14" y2="105"/>
    <text x="-28" y="52.5" text-anchor="middle" stroke="none" transform="rotate(-90 -28 52.5)">105″  ·  8′–9″</text>
  </g>

  <!-- Title panel -->
  <line x1="248" y1="-48" x2="248" y2="172" stroke="#1a1a1a" stroke-width="0.7"/>
  <g fill="#1a1a1a">
    <text x="264" y="-28" font-size="11">KITCHEN PLAN</text>
    <text x="264" y="-16" font-size="6.5">Unit 2130</text>
    <line x1="264" y1="-8" x2="384" y2="-8" stroke="#1a1a1a" stroke-width="0.4"/>

    <text x="264" y="8" font-size="4.6">The Allison Condominiums</text>
    <text x="264" y="16" font-size="4.6">14145 N 92nd St #2130</text>
    <text x="264" y="24" font-size="4.6">Scottsdale, Arizona 85260</text>

    <text x="264" y="40" font-size="4.4" fill="#3f3a34">Tallbot  ·  2 bed / 2 bath</text>
    <text x="264" y="48" font-size="4.4" fill="#3f3a34">Built 1988</text>

    <text x="264" y="66" font-size="3.6" fill="#6b6560" letter-spacing="0.8">SCALE</text>
    <text x="264" y="74" font-size="4.6">1 unit  =  1 inch</text>

    <text x="264" y="92" font-size="3.6" fill="#6b6560" letter-spacing="0.8">ORIENTATION</text>
    <text x="264" y="100" font-size="4.4">Hall side is north.</text>

    <text x="264" y="118" font-size="3.6" fill="#6b6560" letter-spacing="0.8">DATE</text>
    <text x="264" y="126" font-size="4.6">7 October 2026</text>

    <rect x="264" y="144" width="120" height="16" fill="none" stroke="#1a1a1a" stroke-width="0.7"/>
    <text x="324" y="154.5" font-size="4.2" text-anchor="middle" letter-spacing="0.4">NOT FOR CONSTRUCTION</text>
  </g>
</svg>
