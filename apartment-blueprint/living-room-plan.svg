<svg xmlns="http://www.w3.org/2000/svg" viewBox="-64 -52 500 250" font-family="Helvetica, Arial, sans-serif">
  <!-- UNIT 2130 LIVING ROOM - 1 unit = 1 inch - origin at northwest corner, x east, y south -->
  <rect x="-54" y="-42" width="480" height="230" fill="none" stroke="currentColor" stroke-width="1.25"/>
  <rect x="-52.5" y="-40.5" width="477" height="227" fill="none" stroke="var(--muted)" stroke-width="0.35"/>

  <g stroke="currentColor" fill="none">
    <line x1="0" y1="0" x2="48" y2="0" stroke-width="3.25"/>
    <line x1="84" y1="0" x2="157" y2="0" stroke-width="3.25"/>
    <!-- Slider -->
    <line x1="0" y1="0" x2="0" y2="48" stroke-width="3.25"/>
    <line x1="0" y1="120" x2="0" y2="152" stroke-width="3.25"/>
    <line x1="0" y1="48" x2="0" y2="120" stroke-width="0.9"/>
    <line x1="-4" y1="48" x2="4" y2="48" stroke-width="0.7"/>
    <line x1="-4" y1="120" x2="4" y2="120" stroke-width="0.7"/>
    <!-- South wall, apartment exit toward the slider -->
    <line x1="0" y1="152" x2="9" y2="152" stroke-width="3.25"/>
    <line x1="45" y1="152" x2="157" y2="152" stroke-width="3.25"/>
    <!-- Kitchen, open past the run toward dining -->
    <line x1="157" y1="0" x2="157" y2="123" stroke-width="3.25"/>

    <rect x="157" y="0" width="14" height="66" fill="var(--surface)" stroke-width="1"/>
    <rect x="157" y="66" width="14" height="57" fill="var(--surface)" stroke-width="0.8"/>
    <line x1="157" y1="66" x2="171" y2="66" stroke-width="0.7"/>
    <line x1="144" y1="0" x2="144" y2="66" stroke-dasharray="2.2 1.6" stroke-width="0.8"/>

    <circle cx="131" cy="14" r="6.5" fill="var(--surface)" stroke-width="0.9"/>
    <circle cx="131" cy="36" r="6.5" fill="var(--surface)" stroke-width="0.9"/>
    <circle cx="131" cy="58" r="6.5" fill="var(--surface)" stroke-width="0.9"/>

    <circle cx="78" cy="74" r="5" stroke-width="0.8"/>
    <line x1="78" y1="69" x2="78" y2="79" stroke-width="0.45"/>
    <line x1="73" y1="74" x2="83" y2="74" stroke-width="0.45"/>
  </g>

  <g fill="currentColor" font-size="5" text-anchor="middle">
    <text x="78" y="108">LIVING ROOM</text>
    <text x="90" y="76" font-size="3.6" text-anchor="start">FAN</text>
  </g>

  <g fill="var(--muted)" font-size="3.8" stroke="var(--muted)">
    <line x1="124" y1="36" x2="108" y2="28" stroke-width="0.45"/>
    <text x="106" y="26" stroke="none" text-anchor="end">Three stools</text>
    <text x="106" y="31" stroke="none" text-anchor="end">at the bar</text>

    <line x1="157" y1="138" x2="176" y2="138" stroke-width="0.45"/>
    <text x="178" y="140" stroke="none" text-anchor="start">Open to dining</text>

    <line x1="0" y1="84" x2="16" y2="70" stroke-width="0.45"/>
    <text x="18" y="68" stroke="none" text-anchor="start">Balcony slider</text>

    <line x1="66" y1="0" x2="66" y2="8" stroke-width="0.45"/>
    <text x="66" y="16" stroke="none">Bedroom</text>

    <line x1="27" y1="152" x2="27" y2="164" stroke-width="0.45"/>
    <text x="27" y="172" stroke="none">Exit</text>
  </g>

  <g stroke="var(--muted)" fill="var(--muted)" stroke-width="0.55" font-size="4.2">
    <line x1="0" y1="-16" x2="157" y2="-16"/>
    <line x1="0" y1="-20" x2="0" y2="-12"/>
    <line x1="157" y1="-20" x2="157" y2="-12"/>
    <text x="78.5" y="-24" text-anchor="middle" stroke="none">157&#8243;  &#183;  13&#8242;&#8211;1&#8243;</text>

    <line x1="-28" y1="0" x2="-28" y2="152"/>
    <line x1="-32" y1="0" x2="-24" y2="0"/>
    <line x1="-32" y1="152" x2="-24" y2="152"/>
    <text x="-38" y="76" text-anchor="middle" stroke="none" transform="rotate(-90 -38 76)">152&#8243;  &#183;  12&#8242;&#8211;8&#8243;</text>
  </g>

  <line x1="268" y1="-42" x2="268" y2="188" stroke="currentColor" stroke-width="0.7"/>
  <g fill="currentColor">
    <text x="284" y="-22" font-size="11">LIVING ROOM</text>
    <text x="284" y="-10" font-size="6.5">Unit 2130</text>
    <line x1="284" y1="-2" x2="404" y2="-2" stroke="currentColor" stroke-width="0.4"/>

    <text x="284" y="14" font-size="4.6">The Allison Condominiums</text>
    <text x="284" y="22" font-size="4.6">14145 N 92nd St #2130</text>
    <text x="284" y="30" font-size="4.6">Scottsdale, Arizona 85260</text>

    <text x="284" y="48" font-size="3.6" fill="var(--muted)" letter-spacing="0.8">SCALE</text>
    <text x="284" y="56" font-size="4.6">1 unit  =  1 inch</text>

    <text x="284" y="74" font-size="3.6" fill="var(--muted)" letter-spacing="0.8">ORIENTATION</text>
    <text x="284" y="82" font-size="4.4">Left: balcony slider</text>
    <text x="284" y="90" font-size="4.4">Right: kitchen bar</text>

    <text x="284" y="108" font-size="3.6" fill="var(--muted)" letter-spacing="0.8">ROOM</text>
    <text x="284" y="116" font-size="4.4">Carpet. Vaulted ceiling.</text>
    <text x="284" y="124" font-size="4.4">Slider faces the sink.</text>

    <text x="284" y="142" font-size="3.6" fill="var(--muted)" letter-spacing="0.8">DATE</text>
    <text x="284" y="150" font-size="4.6">7 October 2026</text>

    <rect x="284" y="164" width="120" height="16" fill="none" stroke="currentColor" stroke-width="0.7"/>
    <text x="344" y="174.5" font-size="4.2" text-anchor="middle" letter-spacing="0.4">NOT FOR CONSTRUCTION</text>
  </g>
</svg>
